<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — voxel open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f9b57e; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  #game { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; top: 12px; left: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }
  #cash { font-size: 28px; font-weight: 800; }
  #healthbar-wrap { width: 180px; height: 10px; background: rgba(0,0,0,.5); border-radius: 5px; margin-top: 4px; }
  #healthbar { height: 100%; width: 100%; background: #46d160; border-radius: 5px; }
  #health, #armour { font-size: 14px; }
  #wanted { font-size: 26px; letter-spacing: 2px; margin-top: 2px; }
  #objective { font-size: 15px; margin-top: 6px; max-width: 320px; }
  #speed { font-size: 20px; font-weight: 700; margin-top: 4px; }
  #weapon, #bombs, #relationship { font-size: 14px; }
  #toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 8px; font-size: 16px; pointer-events: none; }
  #minimap { position: absolute; top: 12px; right: 12px; width: 200px; height: 200px; border: 2px solid rgba(255,255,255,.6); border-radius: 6px; background: #1d2b1d; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
  #menu { position: absolute; inset: 0; display: none; background: rgba(20, 12, 30, .55); color: #fff; text-align: center; padding-top: 12vh; }
  #menu-title { font-size: 52px; font-weight: 900; letter-spacing: 4px; color: #ffd75e; text-shadow: 0 3px 0 #c22, 0 6px 18px rgba(0,0,0,.6); }
  #menu-body { font-size: 17px; line-height: 1.6; max-width: 640px; margin: 18px auto; }
  #menu-hint { font-size: 14px; opacity: .85; margin-top: 14px; }
  #menu button { pointer-events: auto; font-size: 18px; padding: 10px 26px; margin: 6px; border: 0; border-radius: 8px; background: #ffd75e; color: #222; font-weight: 700; cursor: pointer; }
  #menu button:hover { background: #ffe08a; }
  #controls { position: absolute; bottom: 10px; left: 12px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.8); opacity: .9; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <div id="cash">$150</div>
    <div id="healthbar-wrap"><div id="healthbar"></div></div>
    <div id="health">100 HP</div>
    <div id="armour"></div>
    <div id="wanted">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
    <div id="objective">Steal a car and drive to the garage.</div>
    <div id="speed">0 km/h</div>
    <div id="weapon">Weapon: Pistol</div>
    <div id="bombs">Bombs: 3</div>
    <div id="relationship"></div>
  </div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <div id="menu">
    <div id="menu-title">SOLMAR BAY</div>
    <div id="menu-body"></div>
    <div>
      <button id="btn-new">New Game</button>
      <button id="btn-continue">Continue</button>
      <button id="btn-resume" style="display:none">Resume</button>
    </div>
    <div id="menu-hint"></div>
  </div>
  <div id="controls">WASD move &middot; Shift run &middot; E interact / enter car &middot; F punch &middot; G bomb &middot; Click shoot &middot; 1/2/3 weapons &middot; Space handbrake / parachute &middot; Esc pause &middot; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
